[project]
name = "spellerp300"
version = "0.1.0"
description = "P300 BCI Speller with LLM integration and SSVEP support"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NeuroTech ASU" }]
license = { text = "MIT" }

dependencies = [
    # PsychoPy - verified compatible with NumPy 2.0 and Windows
    "psychopy>=2023.2.3",
    
    # Lab Streaming Layer - real-time EEG data streaming
    "pylsl>=1.16.0",
    
    # Core scientific computing
    "numpy>=1.24.0,<2.2.0",
    "scipy>=1.10.0",
    
    # EEG processing and ASR
    "mne>=1.5.0",
    "asrpy>=0.0.2",
    
    # Machine learning for P300 classification
    "scikit-learn>=1.3.0",
    "pyriemann>=0.4.0",
    
    # LLM integration (OpenAI-compatible API)
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B028", "UP006", "UP007"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true